[project]
name = "cartamercato-grattatore"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "gspread>=6.0.0",
    "loguru>=0.7.3",
    "overrides==7.7.0",
    "pydantic>=2.13.4",
    "selenium>=4.15.0",
]

[dependency-groups]
dev = [
    "pre-commit==3.7.0",
    "requests_mock>=1.12.1,<2",
    "ruff>=0.15.18",
]
test = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-env>=1.1.3,<2",
    "pytest-httpx>=0.30.0",
    "pytest-mock==3.14.0",
]

[project.scripts]
cartamercato-grattatore = "cartamercato_grattatore.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartamercato_grattatore"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ANN"
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
